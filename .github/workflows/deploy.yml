name: Deploy

# Ships main to AWS after CI passes, or on demand. Does nothing until the AWS variables from
# `terraform output github_variables` are set in the repository (Settings > Secrets and variables >
# Actions > Variables). See docs/ops/go-live.md.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        id: image
        working-directory: apps/api
        run: |
          tag=$(git rev-parse --short=12 HEAD)
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$tag"
          if ! aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            docker build --build-arg APP_VERSION="$tag" -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Release the API (rolls back on its own if it does not become healthy)
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_TASK_FAMILY }}" --query taskDefinition > current.json
          jq --arg img "${{ steps.image.outputs.image }}" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' current.json > next.json
          arn=$(aws ecs register-task-definition --cli-input-json file://next.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_SERVICE }}" --task-definition "$arn" >/dev/null
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and upload the web app
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          out=dist/web/browser
          # Hashed files are cached for a year; index.html is always checked again.
          aws s3 sync "$out" "s3://${{ vars.WEB_BUCKET }}" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$out/index.html" "s3://${{ vars.WEB_BUCKET }}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_ID }}" --paths /index.html >/dev/null
